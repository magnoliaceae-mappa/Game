
name: Deploy React Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Verify Vite production output
        run: |
          echo "FILES GENERATED IN DIST:"
          find dist -maxdepth 2 -type f -print

          echo "CONTENTS OF DIST/INDEX.HTML:"
          cat dist/index.html

          if grep -q '/src/main.jsx' dist/index.html; then
            echo "ERROR: dist/index.html still references the source file."
            exit 1
          fi

          if ! grep -q 'assets/.*\.js' dist/index.html; then
            echo "ERROR: No compiled JavaScript asset reference found."
            exit 1
          fi

          echo "SUCCESS: Production HTML references a compiled asset."

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
